<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  
  <!-- Anti-Cache Meta Tags to prevent Mobile Browser Stale Cache -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Thời Khóa Biểu Trực Quan - Lớp DH13KE2</title>
  <meta name="description" content="Ứng dụng tra cứu Thời khóa biểu học tập trực quan, hỗ trợ Zoom Fit cả tuần cho điện thoại di động lớp DH13KE2 năm học 2026. Lọc theo tuần, thứ trong tuần, giảng viên, môn học và tiết học.">
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Stylesheet with Dynamic Version Cache-Buster -->
  <link rel="stylesheet" href="style.css?v=20260730_v2">
  
  <style>
    @media print {
      body { background: #ffffff !important; color: #000000 !important; }
      .bg-glow-container, .toolbar-card, .mobile-day-bar, .legend-card, .btn-icon, .search-box, .view-tabs, #themeToggleBtn, #exportBtn, #uploadBtnLabel, #zoomToolbarBtn, #reloadAppBtn { display: none !important; }
      .timetable-container { box-shadow: none !important; border: 1px solid #ccc !important; }
      .course-card { page-break-inside: avoid; border: 1px solid #999 !important; background: #f0f0f0 !important; color: #000 !important; }
    }
  </style>
</head>
<body>

  <!-- Ambient Glow Background Blobs -->
  <div class="bg-glow-container" aria-hidden="true">
    <div class="bg-glow-blob bg-glow-blob-1"></div>
    <div class="bg-glow-blob bg-glow-blob-2"></div>
    <div class="bg-glow-blob bg-glow-blob-3"></div>
  </div>

  <!-- Main Container -->
  <main class="app-container">

    <!-- Header Section -->
    <header class="header-card">
      <div class="brand-info">
        <div class="brand-icon">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1>
            THỜI KHÓA BIỂU HỌC TẬP
            <span class="badge-class" id="classNameText">DH13KE2</span>
          </h1>
          <p id="yearText">Năm học 2026 • Hệ chính quy</p>
        </div>
      </div>

      <!-- Header Summary Metrics -->
      <div class="header-metrics">
        <div class="metric-pill">
          <div class="icon">
            <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
          </div>
          <div>
            <div class="val" id="metricCredits">15 STC</div>
            <div class="lbl">Tổng tín chỉ</div>
          </div>
        </div>

        <div class="metric-pill">
          <div class="icon">
            <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
          </div>
          <div>
            <div class="val" id="metricSubjects">5 Môn</div>
            <div class="lbl">Học phần</div>
          </div>
        </div>

        <div class="metric-pill">
          <div class="icon">
            <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          </div>
          <div>
            <div class="val" id="metricWeeks">9 Tuần</div>
            <div class="lbl">Thời gian</div>
          </div>
        </div>
      </div>
    </header>

    <!-- Toolbar Controls Section -->
    <section class="toolbar-card">
      
      <!-- Week Controls -->
      <div class="week-navigation">
        <button class="btn-icon" id="prevWeekBtn" title="Tuần trước">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>

        <div class="week-select-wrapper">
          <select id="weekSelect" class="week-select" aria-label="Chọn tuần học"></select>
        </div>

        <button class="btn-icon" id="nextWeekBtn" title="Tuần sau">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </button>

        <button class="btn-text" id="todayBtn">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          Tuần này
        </button>
      </div>

      <!-- Actions & Filters -->
      <div class="toolbar-actions">
        <!-- Search Input -->
        <div class="search-box">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          <input type="text" id="searchInput" class="search-input" placeholder="Tìm môn, GV, phòng..." aria-label="Tìm kiếm môn học">
        </div>

        <!-- View Tabs -->
        <div class="view-tabs">
          <button class="view-tab active" data-mode="weekly">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
            Lịch Tuần
          </button>
          <button class="view-tab" data-mode="catalog">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            Môn học
          </button>
          <button class="view-tab" data-mode="master">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
            Tất cả
          </button>
        </div>

        <!-- Force Hard Reload App Button (Removes Cache) -->
        <button class="btn-icon" id="reloadAppBtn" title="Xóa cache và làm mới bản mới nhất">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        </button>

        <!-- Zoom Fit Week Button -->
        <button class="btn-icon" id="zoomToolbarBtn" title="Thu nhỏ xem trọn tuần (Fit Screen)">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7"></path></svg>
        </button>

        <!-- Export Image / Print Button -->
        <button class="btn-icon" id="exportBtn" title="In hoặc Xuất Thời Khóa Biểu">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
        </button>

        <!-- Load JSON File Button -->
        <label for="jsonFileInput" class="btn-icon" id="uploadBtnLabel" title="Tải file tkb.json khác">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
        </label>
        <input type="file" id="jsonFileInput" accept=".json" style="display: none;">

        <!-- Theme Toggle Button -->
        <button class="btn-icon" id="themeToggleBtn" title="Đổi giao diện Tối/Sáng">
          <!-- Icon injected dynamically by JS -->
        </button>
      </div>

    </section>

    <!-- Mobile Day Filter & Zoom Bar -->
    <nav class="mobile-day-bar" aria-label="Lọc theo ngày và Zoom trên điện thoại">
      <button class="mobile-day-pill zoom-pill" id="zoomToggleBtn" title="Bật/Tắt thu nhỏ toàn tuần">🔍 Fit Tuần</button>
      <button class="mobile-day-pill active" data-day="all">Tất cả</button>
      <button class="mobile-day-pill" data-day="2">Thứ 2</button>
      <button class="mobile-day-pill" data-day="3">Thứ 3</button>
      <button class="mobile-day-pill" data-day="4">Thứ 4</button>
      <button class="mobile-day-pill" data-day="5">Thứ 5</button>
      <button class="mobile-day-pill" data-day="6">Thứ 6</button>
      <button class="mobile-day-pill" data-day="7">Thứ 7</button>
    </nav>

    <!-- Subject Legend Section -->
    <section class="legend-card">
      <div class="legend-title">Chú thích môn học:</div>
      <div class="legend-items" id="legendItems"></div>
    </section>

    <!-- Main Dynamic Timetable Container -->
    <section class="timetable-container" id="timetableContainer">
      <div id="timetableRenderArea"></div>
    </section>

  </main>

  <!-- Interactive Class Details Modal -->
  <div class="modal-backdrop" id="detailModal">
    <div class="modal-card">
      <button class="modal-close-btn" onclick="closeModal()" title="Đóng">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- JavaScript with Dynamic Cache-Buster Version -->
  <script src="app.js?v=20260730_v2"></script>

</body>
</html>
